<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control Interno</title>
    <!-- Importar estilos -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- VISTA DE LOGIN-->
    <div id="loginView" class="view active">
        <div class="login-container">
            <div class="login-title">Iniciar sesión</div>
            <p class="login-subtitle">Ingresa tu ID</p>
            
            <div class="form-group">
                <label for="userId">ID de usuario:</label>
                <input 
                    type="text" 
                    id="userId" 
                    class="input-field"
                    placeholder="Ej: C001 o P001"
                    maxlength="20"
                >
            </div>

            <button id="loginBtn" class="btn btn-primary">Ingresar</button>

            <!-- Mensaje de error -->
            <div id="loginError" class="error-message"></div>

            <!-- Información de prueba -->
            <div class="info-box">
                <strong>Credenciales de prueba:</strong><br>
                • C001 (CALIDAD)<br>
                • P001 (PRODUCCIÓN)
            </div>
        </div>
    </div>

    <!--  VISTA DEL PANEL PRINCIPAL  -->
    <div id="panelView" class="view">
        <!-- Encabezado -->
        <div class="panel-header">
            <div class="user-info">
                <span class="label">Usuario:</span>
                <span class="user-type" id="userTypeDisplay">--</span>
            </div>
            <button id="logoutBtn" class="btn btn-secondary">Cerrar Sesión</button>
        </div>

        <!-- Mensaje de estado -->
        <div id="statusMessage" class="status-message"></div>

        <!-- Contenedor principal del panel -->
        <div class="panel-content">
            <!-- Botones de opciones -->
            <div class="buttons-grid">
                <button class="btn-option" data-action="1">
                    <span class="option-number">1</span>
                    <span class="option-text">Eliminar caja</span>
                </button>
                <button class="btn-option" data-action="2">
                    <span class="option-number">2</span>
                    <span class="option-text">Borrar historial de pieza</span>
                </button>
                <button class="btn-option" data-action="3">
                    <span class="option-number">3</span>
                    <span class="option-text">Mover piezas de orden de trabajo</span>
                </button>
                <button class="btn-option" data-action="4">
                    <span class="option-number">4</span>
                    <span class="option-text">Botón sin asignar</span>
                </button>
                <button class="btn-option" data-action="5">
                    <span class="option-number">5</span>
                    <span class="option-text">Botón sin asignar</span>
                </button>
            </div>
        </div>
    </div>

    <!--  MODAL DE ACCIONES  -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Modal</h2>
                <button id="modalCloseBtn" class="modal-close">&times;</button>
            </div>

            <div class="modal-body">
                <!-- Formulario para Eliminar Caja -->
                <div id="deleteBatchForm" class="modal-form" style="display: none;">
                    <div class="form-group">
                        <label for="batchId">ID de caja a eliminar:</label>
                        <input type="text" id="batchId" class="input-field" placeholder="Ej: CAJA001">
                    </div>
                </div>

                <!-- Formulario para Borrar Historial -->
                <div id="deleteHistoryForm" class="modal-form" style="display: none;">
                    <div class="form-group">
                        <label for="pieceHistoryId">ID de pieza:</label>
                        <input type="text" id="pieceHistoryId" class="input-field" placeholder="Ej: PIEZA123">
                    </div>
                </div>

                <!-- Formulario para Mover Piezas -->
                <div id="movePiecesForm" class="modal-form" style="display: none;">
                    <div class="form-group">
                        <label for="originalOrder">Número de orden original:</label>
                        <input type="number" id="originalOrder" class="input-field" placeholder="Ej: 20">
                    </div>
                    <div class="form-group">
                        <label for="pieceId">ID de pieza devuelta:</label>
                        <input type="number" id="pieceId" class="input-field" placeholder="Ej: 2">
                    </div>
                    <div class="form-group">
                        <label for="newOrder">Número de orden nueva:</label>
                        <input type="number" id="newOrder" class="input-field" placeholder="Ej: 45">
                    </div>
                </div>

                <!-- Resultado -->
                <div id="modalResult" class="modal-result" style="display: none;"></div>
            </div>

            <div class="modal-footer">
                <button id="modalExecuteBtn" class="btn btn-primary">Ejecutar</button>
                <button id="modalCancelBtn" class="btn btn-secondary">Cancelar</button>
            </div>
        </div>
    </div>

    <!--  SCRIPTS  -->
    <!-- Orden: services → modules → app principal -->
    <script src="js/services/navigation.js"></script>
    <script src="js/modules/auth.js"></script>
    <script src="js/modules/roles.js"></script>
    <script src="js/modules/actions.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
